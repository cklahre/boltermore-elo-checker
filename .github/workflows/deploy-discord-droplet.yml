name: Deploy Discord bot to droplet

on:
  push:
    branches:
      - main
    paths-ignore:
      - "site/**"
  workflow_dispatch:

concurrency:
  group: discord-droplet-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify secrets
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BOT_API_SECRET: ${{ secrets.DISCORD_BOT_API_SECRET }}
        run: |
          test -n "$DO_HOST" || (echo "Secret DO_HOST is required" >&2 && exit 1)
          test -n "$DISCORD_BOT_TOKEN" || (echo "Secret DISCORD_BOT_TOKEN is required" >&2 && exit 1)
          test -n "$DISCORD_GUILD_ID" || (echo "Secret DISCORD_GUILD_ID is required" >&2 && exit 1)
          test -n "$DISCORD_BOT_API_SECRET" || (echo "Secret DISCORD_BOT_API_SECRET is required" >&2 && exit 1)

      - name: Build Linux binaries
        run: |
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o eloevent-bot ./discord-bot/cmd/bot
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o local-elo ./cmd/local-elo
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bcp-harvest-events ./cmd/bcp-harvest-events
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bcp-export-matches ./cmd/bcp-export-matches
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bcp-matches-manifest ./cmd/bcp-matches-manifest
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 \
            go build -trimpath -ldflags="-s -w" -o bcp-purge-matches-by-name ./cmd/bcp-purge-matches-by-name

      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Add SSH known_hosts
        env:
          DO_HOST: ${{ secrets.DO_HOST }}
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$DO_HOST" >> ~/.ssh/known_hosts

      - name: Deploy and restart
        env:
          HOST: ${{ secrets.DO_HOST }}
          DO_SSH_USER: ${{ vars.DO_SSH_USER }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_BOT_API_SECRET: ${{ secrets.DISCORD_BOT_API_SECRET }}
        run: |
          U="${DO_SSH_USER:-root}"
          ssh "$U@$HOST" 'mkdir -p /opt/eloevent/repo /opt/eloevent/bin /opt/eloevent/data /opt/eloevent/env /opt/eloevent/scripts'
          printf 'DISCORD_BOT_TOKEN=%s\nDISCORD_GUILD_ID=%s\nBOLTERMORE_WEB_URL=http://127.0.0.1:3000\nDISCORD_BOT_API_SECRET=%s\n' "$DISCORD_BOT_TOKEN" "$DISCORD_GUILD_ID" "$DISCORD_BOT_API_SECRET" \
            | ssh "$U@$HOST" 'umask 077; cat >/opt/eloevent/env/bot.env && chmod 600 /opt/eloevent/env/bot.env'
          rsync -avz --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.cursor/' \
            --exclude 'bcp-matches.json' \
            --exclude 'eloevent-bot' \
            --exclude 'local-elo' \
            --exclude 'bcp-harvest-events' \
            --exclude 'bcp-export-matches' \
            --exclude 'bcp-matches-manifest' \
            --exclude 'bcp-purge-matches-by-name' \
            "${GITHUB_WORKSPACE}/" "$U@$HOST:/opt/eloevent/repo/"
          rsync -avz eloevent-bot local-elo bcp-harvest-events bcp-export-matches bcp-matches-manifest bcp-purge-matches-by-name \
            "$U@$HOST:/opt/eloevent/bin/"
          rsync -avz scripts/droplet/refresh-leaderboard.sh \
            scripts/droplet/pull-matches.sh \
            scripts/droplet/start-eloevent-discord-bot.sh \
            scripts/droplet/eloevent-refresh-leaderboard.service \
            scripts/droplet/eloevent-refresh-leaderboard.timer \
            scripts/droplet/eloevent-discord-bot.service \
            "$U@$HOST:/opt/eloevent/scripts/"
          rsync -avz scripts/droplet/env/refresh.env.example "$U@$HOST:/opt/eloevent/scripts/refresh.env.example"
          ssh "$U@$HOST" bash -s <<'REMOTE'
          set -euo pipefail
          chmod +x /opt/eloevent/bin/eloevent-bot /opt/eloevent/bin/local-elo \
            /opt/eloevent/bin/bcp-harvest-events /opt/eloevent/bin/bcp-export-matches /opt/eloevent/bin/bcp-matches-manifest \
            /opt/eloevent/bin/bcp-purge-matches-by-name \
            /opt/eloevent/scripts/refresh-leaderboard.sh /opt/eloevent/scripts/pull-matches.sh \
            /opt/eloevent/scripts/start-eloevent-discord-bot.sh
          chmod 644 /opt/eloevent/scripts/eloevent-discord-bot.service \
            /opt/eloevent/scripts/eloevent-refresh-leaderboard.service \
            /opt/eloevent/scripts/eloevent-refresh-leaderboard.timer
          if [[ ! -f /opt/eloevent/env/refresh.env && -f /opt/eloevent/scripts/refresh.env.example ]]; then
            cp /opt/eloevent/scripts/refresh.env.example /opt/eloevent/env/refresh.env
            chmod 600 /opt/eloevent/env/refresh.env
          fi
          cp /opt/eloevent/scripts/eloevent-discord-bot.service /etc/systemd/system/eloevent-discord-bot.service
          cp /opt/eloevent/scripts/eloevent-refresh-leaderboard.service /etc/systemd/system/eloevent-refresh-leaderboard.service
          cp /opt/eloevent/scripts/eloevent-refresh-leaderboard.timer /etc/systemd/system/eloevent-refresh-leaderboard.timer
          systemctl daemon-reload
          systemctl enable --now eloevent-refresh-leaderboard.timer
          systemctl restart eloevent-discord-bot
          REMOTE
